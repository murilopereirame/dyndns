name: 🗃️ Publish
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch, tag or commit SHA to build
        type: string
        default: main
env:
  GO_VERSION: 1.26.x
  SUPPORTED_ARCHITECTURES: ("amd64" "arm64")

jobs:
  publish:
    name: 🚀 Publish DYNDNS
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: 🛠 Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🖥️ Display Go version
        run: go version

      - name: 🧰 Install dependencies
        run: go mod download

      - name: 🐧 Build Linux binaries
        run: |
          archs=${{ env.SUPPORTED_ARCHITECTURES }}
          for arch in "${archs[@]}"; do
            GOOS=linux GOARCH=$arch go build -o ./dyndns_linux_$arch ./cmd
          done

      - name: 🍎 Build macOS binaries
        run: |
          archs=${{ env.SUPPORTED_ARCHITECTURES }}
          for arch in "${archs[@]}"; do
            GOOS=darwin GOARCH=$arch go build -o ./dyndns_macos_$arch ./cmd
          done

      - name: 🪟 Build Windows binaries
        run: |
          archs=${{ env.SUPPORTED_ARCHITECTURES }}
          for arch in "${archs[@]}"; do
            GOOS=windows GOARCH=$arch go build -o ./dyndns_windows_$arch.exe ./cmd
          done

      - name: 💾 Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./dyndns_linux_*
            ./dyndns_macos_*
            ./dyndns_windows_*
